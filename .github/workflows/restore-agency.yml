name: Restore orbita-agency
on:
  workflow_dispatch:
  push:
    paths:
      - '_restore/agency.b64.*'
      - '_restore/MANIFEST'
      - '.github/workflows/restore-agency.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact orbita-agency.html from b64+gzip parts
        run: |
          set -euo pipefail
          ls -la _restore/
          EXPECTED_BYTES=244994
          EXPECTED_SHA=25c7f78cb5f21c1bb17d669cd3189080580f5b01b9695c1ba1766d41f517397e
          cat _restore/agency.b64.00 _restore/agency.b64.01 _restore/agency.b64.02 _restore/agency.b64.03 _restore/agency.b64.04 > /tmp/agency.gz.b64
          base64 -d /tmp/agency.gz.b64 > /tmp/agency.html.gz
          gzip -dc /tmp/agency.html.gz > orbita-agency.html
          BYTES=$(wc -c < orbita-agency.html)
          echo "assembled bytes=$BYTES"
          test "$BYTES" -eq "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA  orbita-agency.html" | sha256sum -c -
          grep -q 'tt-intro-meta' orbita-agency.html
          grep -qE 'svc-orbit|svc-planet' orbita-agency.html
          grep -q 'mobile-tiktok-enhance.js' orbita-agency.html
          grep -q 'ttApp' orbita-agency.html
          grep -q 'baked-conversion' orbita-agency.html
          head -c 15 orbita-agency.html | grep -q '<!DOCTYPE html'
      - name: Commit restored site
        run: |
          set -euo pipefail
          git config user.name "orbita-restore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbita-agency.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore full orbita-agency.html with baked mobile conversion."
          git push origin HEAD:main
